name: Android CI and Automatic Releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate missing Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Generate CI debug keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mandala-art-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mandala-art-build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  detect-production-changes:
    name: Check whether app changes require a production release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.filter.outputs.should_release }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect app or build changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_FILES="$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}")"
          printf '%s\n' "$CHANGED_FILES"
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(app/|gradle/|build\.gradle(\.kts)?$|settings\.gradle(\.kts)?$|gradle\.properties$|gradlew$|gradlew\.bat$)'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Application/build changes detected; production release is eligible."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No application/build changes detected; skipping production release."
          fi

  build-sign-and-publish-production:
    name: Build, sign, and publish production release
    needs: [build-and-test, detect-production-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-production-changes.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate missing Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Calculate monotonically increasing Android version and release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n '/versionName[[:space:]]*=/s/.*orElse("\([^"]*\)").*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          RELEASE_TAG="v${VERSION_NAME}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $VERSION_CODE"
          echo "Android versionName: $VERSION_NAME"
          echo "Release tag: $RELEASE_TAG"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret KEYSTORE_BASE64"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/Mandala-Art-${RELEASE_TAG}.apk"
          (cd release-assets && sha256sum "Mandala-Art-${RELEASE_TAG}.apk" > SHA256SUMS.txt)

      - name: Clean up release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/my-upload-key.jks"

      - name: Upload signed APK artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: mandala-art-signed-release-${{ steps.version.outputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub production release with direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Mandala Art ${{ steps.version.outputs.release_tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Mandala-Art-${{ steps.version.outputs.release_tag }}.apk
            release-assets/SHA256SUMS.txt
          body: |
            ## Mandala Art for Android

            A signed production build of Mandala Art, a mandala coloring studio for Android.

            ## What's included

            GitHub's generated release notes below summarize the changes included in this version.

            ## Download and install

            1. Download `Mandala-Art-${{ steps.version.outputs.release_tag }}.apk` from the Assets section.
            2. Open the APK on your Android device and follow the installation prompts.
            3. To update an existing installation, install over the current app. Do not uninstall the app or clear its data as part of a normal update.

            ## Build and integrity

            - The debug build and unit tests passed in GitHub Actions before publication.
            - The production APK signature was verified with `apksigner`.
            - `SHA256SUMS.txt` contains the APK SHA-256 checksum for integrity verification.

            ## Changes in this release

            See the automatically generated changelog below for the commits and pull requests included in this release.
